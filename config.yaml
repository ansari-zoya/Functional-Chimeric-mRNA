project:
  name: Functional_Chimeric_mRNA_Reproduction
  output_dir: /home/asus/bioinformatics/Functional_Chimeric_mRNA/results/typhon_output
  threads: 2
  author: ansari-zoya
input:
  fastq_dir: /home/asus/bioinformatics/Functional_Chimeric_mRNA/data/fastq
references:
  genome: /home/asus/bioinformatics/Functional_Chimeric_mRNA/reference/GRCm39.primary_assembly.genome.fa
  gtf: /home/asus/bioinformatics/Functional_Chimeric_mRNA/reference/gencode.vM28.annotation.gtf.gz
  transcriptome: /home/asus/bioinformatics/Functional_Chimeric_mRNA/reference/gencode.vM28.transcripts.fa.gz
modules:
  longgf:
    enabled: true
    keep_intermediate: false
    min_overlap_len: 100
    bin_size: 50
    min_map_len: 100
    pseudogene: 2
    secondary_alignment: 0
    min_sup_read: 1
    output_flag: 0
  genion:
    enabled: true
    min_support: 1
    keep_debug: true
    output_bin_dir: ./bin
    debug_compilation: true
    threads: 2
  jaffal:
    enabled: true
    jaffal_dir: /home/asus/bioinformatics/Functional_Chimeric_mRNA/tools/TYPHON/jaffal/JAFFA-version-2.3
    genome_build: mm39
    annotation: gencode_M28
    max_memory: 4G
    bpipe_memory: 4G
    process_samples_sequentially: true
    reference_files:
      genome_fasta_gz: /home/asus/bioinformatics/Functional_Chimeric_mRNA/reference/GRCm39.primary_assembly.genome.fa.gz
      transcriptome_fasta: /home/asus/bioinformatics/Functional_Chimeric_mRNA/reference/gencode.vM28.transcripts.fa.gz
      annotation_bed: /home/asus/bioinformatics/Functional_Chimeric_mRNA/reference/jaffal/mm39_gencode_M28.bed
      annotation_tab: /home/asus/bioinformatics/Functional_Chimeric_mRNA/reference/jaffal/mm39_gencode_M28.tab
    threads: 2
    keep_intermediate: false
    min_low_spanning_reads: 1
    assembly_parameters:
      kmer_lengths: 19,36,4
      oases_merge_length: 27
      transcript_min_length: 100
    trimming_parameters:
      phred_scores: 33
      min_read_length: 35
      min_quality_score: 0
    alignment_parameters:
      map_params: -k1 --no-mixed --no-discordant --mm
      blast_options: -perc_identity 96
      blat_options: -minIdentity=96 -minScore=30
options:
  cleanup_intermediate: true
  debug: true
  keep_sam_files: true
  max_memory_gb: 8
  temp_dir: /tmp
  enable_integration: true
  exon_repair:
    enabled: true
    bam_file: null
    keep_intermediate: true
    blast_threads: 2
